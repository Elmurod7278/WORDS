services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: essential
      POSTGRES_PASSWORD: essential
      POSTGRES_DB: essential
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://essential:essential@postgres:5432/essential
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  pgdata:
